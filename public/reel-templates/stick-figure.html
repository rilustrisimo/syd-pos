<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stick Figure Story</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Patrick+Hand&display=block" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  :root { --paper:#FFFDF7; --ink:#151515; --red:#E63946; --blue:#2B6CB0; }
  body { background:var(--paper); }
  .st { background:var(--paper); }
  .t { font-family:'Comic Neue', sans-serif; font-weight:700; color:var(--ink); line-height:1.02; }
  .t-sub, .t-phone { font-family:'Patrick Hand', cursive; font-weight:400; color:#555; }
  /* The headline is a speech bubble from the character. */
  .t-head { background:#fff; border:9px solid var(--ink); border-radius:70px; padding:44px 50px; box-sizing:border-box; }
  .t-head::after { content:''; position:absolute; left:140px; bottom:-62px; border-left:34px solid transparent; border-right:34px solid transparent; border-top:62px solid var(--ink); transform:skewX(-20deg); }
  .t-head::before { content:''; position:absolute; left:148px; bottom:-44px; border-left:26px solid transparent; border-right:26px solid transparent; border-top:48px solid #fff; transform:skewX(-20deg); z-index:1; }
  .st-cta .t-head, .st-product .t-head { background:none; border:none; padding:0; }
  .st-cta .t-head::after, .st-cta .t-head::before, .st-product .t-head::after, .st-product .t-head::before { display:none; }
  .t-stamp, .t-button { color:var(--red); border:8px solid var(--red); border-radius:20px; padding:10px 24px; transform:rotate(-4deg); box-sizing:border-box; }
  .t-bullet { color:var(--blue); }
  .t-site { color:var(--blue); text-decoration:underline; text-decoration-thickness:6px; text-underline-offset:12px; }
  .ground { position:absolute; height:9px; background:var(--ink); border-radius:5px; }
  .castbox { color:var(--ink); --fig-fill:#fff; --fig-accent:#FFD166; --fig-stroke:12; --prop-stroke:5.5; }
  .castbox .fig-mark { color:var(--red); }
  @keyframes groundIn { from { transform:scaleX(0); } to { transform:scaleX(1); } }
</style>
</head>
<body>
<div id="stage"></div>
<script src="_story.js"></script>
<script>
storyStyle({
  fonts: ['700 Comic Neue', 'Patrick Hand'],
  transition: 'stWipe',
  cast: { enter: 'slide' },
  enter: { head: ['stPop', 0.45, 'cubic-bezier(.3,1.3,.5,1)'], sub: ['stFade', 0.5], stamp: ['stStamp', 0.35], button: ['stPop', 0.4], text: ['stRise', 0.45] },
  layout: { hook: { head: { h: 480 } }, problem: { head: { h: 340 } } },
  // A ground line under the character, drawn left to right.
  decorateCast(c, ctx) {
    const g = ctx.el('div', 'ground')
    g.style.top = (parseFloat(c.style.top) + parseFloat(c.style.height) - 4) + 'px'
    g.style.left = (parseFloat(c.style.left) - 30) + 'px'; g.style.width = (parseFloat(c.style.width) + 60) + 'px'
    g.style.transformOrigin = 'left'
    ctx.animate(g, ['groundIn', 0.5, ctx.at(0.1)])
    c._ground = g
  },
  afterBuild(section) {
    // Put each ground line just behind its character.
    section.querySelectorAll('.castbox').forEach((c) => { if (c._ground) c.parentNode.insertBefore(c._ground, c) })
  },
})
</script>
<script src="_cast.js"></script>
<script src="_props.js"></script>
<script src="_runtime.js"></script>
</body>
</html>
