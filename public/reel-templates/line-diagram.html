<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Line Diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  :root { --bp:#0E3B7A; --line:#DCEBFF; --dim:#8FB8F0; --accent:#FFC107; }
  body { background:var(--bp); }
  .grid { position:absolute; inset:0; background:
      linear-gradient(rgba(220,235,255,.13) 2px, transparent 2px) 0 0/120px 120px,
      linear-gradient(90deg, rgba(220,235,255,.13) 2px, transparent 2px) 0 0/120px 120px,
      linear-gradient(rgba(220,235,255,.06) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, rgba(220,235,255,.06) 1px, transparent 1px) 0 0/24px 24px, var(--bp); }
  .title { font-family:'Space Grotesk', sans-serif; font-weight:700; color:#fff; line-height:1; letter-spacing:-.01em; }
  .mono { font-family:'IBM Plex Mono', monospace; font-weight:500; color:var(--line); }
  .tag { position:absolute; font-family:'IBM Plex Mono', monospace; font-weight:700; color:var(--bp); background:var(--accent); padding:8px 18px; font-size:34px; letter-spacing:.06em; }
  .lines { position:absolute; fill:none; stroke:var(--line); stroke-linecap:square; }
  .lines .acc { stroke:var(--accent); }
  .lines path, .lines rect, .lines line, .lines circle { stroke-dasharray:4000; }
  .block { position:absolute; left:80px; width:920px; border:4px solid var(--line); display:flex; align-items:stretch; }
  .block .no { flex:0 0 140px; border-right:4px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-weight:700; font-size:64px; color:var(--accent); }
  .block .t { flex:0 0 auto; display:flex; align-items:center; padding:0 34px; }
  .stampbox { position:absolute; border:8px solid var(--accent); color:var(--accent); padding:14px 34px; font-family:'IBM Plex Mono'; font-weight:700; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
  .photo { position:absolute; left:220px; top:520px; width:640px; height:640px; background:#fff; border:4px solid var(--line); }
  .photo img { width:100%; height:100%; object-fit:contain; }
  .logo-box { position:absolute; left:290px; top:240px; width:500px; padding:40px; border:4px solid var(--line); }
  .logo-box img { width:100%; display:block; }
  .castbox { color:var(--line); --fig-fill:var(--bp); --fig-accent:rgba(255,193,7,.18); --hat-fill:rgba(255,193,7,.35); --fig-logo:var(--accent); --fig-stroke:7; --prop-stroke:3.5; }
  .castbox .fig-mark { color:var(--accent); }
  .corner { position:absolute; width:50px; height:50px; border-color:var(--accent); border-style:solid; }

  @keyframes gridWipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes draw { from { stroke-dashoffset:4000; } to { stroke-dashoffset:0; } }
  @keyframes type { from { clip-path: inset(-10% 100% -10% 0); } to { clip-path: inset(-10% 0 -10% 0); } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-60px); } to { opacity:1; transform:none; } }
  @keyframes stamp { 0% { opacity:0; transform:scale(1.8) rotate(-6deg); } 70% { opacity:1; transform:scale(.95) rotate(-6deg); } 100% { opacity:1; transform:rotate(-6deg); } }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:.2; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const NS = 'http://www.w3.org/2000/svg'
function lines(markup, { left, top, w, view, width = 5 }) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', view); s.setAttribute('class', 'lines')
  Object.assign(s.style, { left: left + 'px', top: top + 'px', width: w + 'px' }); s.setAttribute('stroke-width', width); s.innerHTML = markup; return s
}
function drawAll(ctx, svg, at, dur = 1, step = .12) { svg.querySelectorAll('path, rect, line, circle').forEach((p, i) => ctx.animate(p, ['draw', dur, at + i * step, 'ease-in-out'])) }
function typed(ctx, text, cls, { left, top, w, h, max, min = 40, at, dur = .7, color }) {
  const n = ctx.el('div', cls, text); Object.assign(n.style, { position: 'absolute', left: left + 'px', top: top + 'px' })
  if (color) n.style.color = color
  ctx.animate(n, ['type', dur, at, 'steps(24)']); ctx.fit(n, { w, h, max, min }); return n
}
function tag(ctx, text, left, top, at) { const t = ctx.el('div', 'tag', text); Object.assign(t.style, { left: left + 'px', top: top + 'px' }); ctx.animate(t, ['fade', .3, at]); return t }
/** Dimension line with end ticks and a label. */
function dimension(ctx, { left, top, w, label, at }) {
  const d = lines(`<line class="acc" x1="10" y1="40" x2="${w - 10}" y2="40"/><line class="acc" x1="10" y1="10" x2="10" y2="70"/><line class="acc" x1="${w - 10}" y1="10" x2="${w - 10}" y2="70"/>`, { left, top, w, view: `0 0 ${w} 80`, width: 4 })
  drawAll(ctx, d, at, .6, .05)
  const l = ctx.el('div', 'mono', label); Object.assign(l.style, { position: 'absolute', left: left + 'px', width: w + 'px', top: (top - 10) + 'px', textAlign: 'center', fontSize: '30px', color: 'var(--accent)' })
  ctx.animate(l, ['fade', .3, at + .4]); return [d, l]
}

window.STYLE = {
  fonts: ['700 Space Grotesk', '500 IBM Plex Mono', '700 IBM Plex Mono'],
  transition: 'gridWipe',
  cast: { enter: 'draw' },
  roles: {
    hook(scene, ctx) {
      const { el, at } = ctx
      const s = el('section'); s.append(el('div', 'grid'))
      s.append(tag(ctx, `FIG. ${String(ctx.index + 1).padStart(2, '0')}`, 80, 140, at(0.02)))
      s.append(typed(ctx, scene.headline, 'title', { left: 80, top: 230, w: 920, h: 560, max: 190, at: at(0.08), dur: Math.min(1, ctx.dur * .4) }))
      if (ctx.hasCast(scene)) {
        s.append(ctx.cast(scene, { left: 100, top: 940, w: 880, h: 780 }, { at: at(0.25) }))
        if (scene.sub) s.append(typed(ctx, scene.sub, 'mono', { left: 80, top: 820, w: 920, h: 90, max: 46, at: at(0.4) }))
        return s
      }
      const house = lines('<path d="M60 300 L400 60 L740 300"/><rect x="120" y="270" width="560" height="360"/><rect x="330" y="430" width="140" height="200"/><rect x="180" y="340" width="110" height="90"/><rect x="510" y="340" width="110" height="90"/><line x1="0" y1="630" x2="800" y2="630"/>', { left: 140, top: 920, w: 800, view: '0 0 800 660', width: 6 })
      drawAll(ctx, house, at(0.25), 1, .1); s.append(house)
      s.append(...dimension(ctx, { left: 260, top: 1610, w: 560, label: 'W = YOUR BUILD', at: at(0.6) }))
      if (scene.sub) s.append(typed(ctx, scene.sub, 'mono', { left: 80, top: 820, w: 920, h: 90, max: 46, at: at(0.4) }))
      return s
    },

    product(scene, ctx) {
      const { el, at, animate, data } = ctx
      const s = el('section'); s.append(el('div', 'grid'))
      s.append(tag(ctx, `FIG. ${String(ctx.index + 1).padStart(2, '0')} · MATERIAL`, 80, 130, at(0.02)))
      s.append(typed(ctx, scene.headline, 'title', { left: 80, top: 210, w: 920, h: 230, max: 160, at: at(0.06) }))
      if (data.product.imageUrl) {
        const ph = el('div', 'photo'); const img = el('img'); img.src = data.product.imageUrl; ph.append(img); animate(ph, ['fade', .5, at(0.15)]); s.append(ph)
        ;[[200, 500, '4px 0 0 4px'], [830, 500, '4px 4px 0 0'], [200, 1130, '0 0 4px 4px'], [830, 1130, '0 4px 4px 0']].forEach(([l, t, b]) => {
          const c = el('div', 'corner'); Object.assign(c.style, { left: l + 'px', top: t + 'px', borderWidth: b }); animate(c, ['fade', .3, at(0.12)]); s.append(c) })
      } else if (ctx.productProp() !== 'cement_bag') {
        s.append(ctx.cast(scene, { left: 240, top: 500, w: 600, h: 600 }, { at: at(0.1), character: null, props: [ctx.productProp()] }))
      } else {
        const bag = lines('<path d="M70 70 Q250 30 430 70 L460 600 Q250 640 40 600 Z"/><path d="M70 70 Q250 110 430 70"/><rect x="105" y="200" width="290" height="220"/><line x1="130" y1="510" x2="370" y2="510"/>', { left: 290, top: 520, w: 500, view: '0 0 500 660', width: 5 })
        drawAll(ctx, bag, at(0.1), 1, .12); s.append(bag)
        const name = el('div', 'mono', (data.product.name || scene.headline).toUpperCase())
        Object.assign(name.style, { position: 'absolute', left: '400px', top: '725px', height: '210px', display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', fontWeight: '700', color: '#fff' })
        animate(name, ['fade', .4, at(0.4)]); s.append(name); ctx.fit(name, { w: 280, h: 210, max: 64, min: 26 })
      }
      // Callout leader from the product to the stamp
      const leader = lines('<circle class="acc" cx="20" cy="20" r="12"/><path class="acc" d="M20 20 L 220 220 L 420 220"/>', { left: 600, top: 1000, w: 440, view: '0 0 440 240', width: 5 })
      drawAll(ctx, leader, at(0.55), .5, .1); s.append(leader)
      if (scene.stamp) { const st = el('div', 'stampbox', scene.stamp); Object.assign(st.style, { left: '470px', top: '1250px' }); animate(st, ['stamp', .35, at(0.66), 'ease-out']); ctx.fit(st, { w: 540, max: 100, min: 40 }); st.style.width = 'auto'; s.append(st) }
      s.append(...dimension(ctx, { left: 290, top: 1250 - (scene.stamp ? -200 : 0), w: 500, label: data.product.name ? 'SPEC: ' + data.product.name.toUpperCase().slice(0, 22) : 'SPEC', at: at(0.3) }))
      if (scene.character) s.append(ctx.cast(scene, { left: 50, top: 1320, w: 240, h: 360 }, { at: at(0.45), props: [], flip: false }))
      if (scene.sub) s.append(typed(ctx, scene.sub, 'mono', { left: scene.character ? 320 : 80, top: 1700, w: scene.character ? 680 : 920, h: 120, max: 46, at: at(0.45) }))
      return s
    },

    proof(scene, ctx) {
      const { el, at, animate } = ctx
      const s = el('section'); s.append(el('div', 'grid'))
      s.append(tag(ctx, `FIG. ${String(ctx.index + 1).padStart(2, '0')} · SPECS`, 80, 130, at(0.02)))
      const items = (scene.items || []).slice(0, 3)
      const side = scene.character && items.length
      s.append(typed(ctx, scene.headline, 'title', { left: 80, top: 210, w: side ? 620 : 920, h: 400, max: 210, at: at(0.05) }))
      if (side) s.append(ctx.cast(scene, { left: 730, top: 170, w: 290, h: 440 }, { at: at(0.15), props: [] }))
      else if (ctx.hasCast(scene)) s.append(ctx.cast(scene, { left: 100, top: 900, w: 880, h: 840 }, { at: at(0.3) }))
      if (scene.sub) s.append(typed(ctx, scene.sub, 'mono', { left: 80, top: 640, w: 920, h: 110, max: 48, at: at(0.14), color: 'var(--dim)' }))
      if (scene.stamp) { const st = el('div', 'stampbox', scene.stamp); Object.assign(st.style, { left: '560px', top: '760px' }); animate(st, ['stamp', .35, at(0.28), 'ease-out']); ctx.fit(st, { w: 420, max: 70, min: 34 }); st.style.width = 'auto'; s.append(st) }
      items.forEach((text, i) => {
        const b = el('div', 'block'); Object.assign(b.style, { top: (900 + i * 240) + 'px', height: '200px' })
        const no = el('div', 'no', String(i + 1).padStart(2, '0')); const t = el('div', 't title', text); b.append(no, t)
        animate(b, ['slideIn', .5, at(0.36 + i * (0.5 / Math.max(1, items.length)))]); ctx.fit(t, { w: 760, h: 192, max: 100, min: 40 }); s.append(b)
      })
      return s
    },

    cta(scene, ctx) {
      const { el, at, animate, data } = ctx
      const s = el('section'); s.append(el('div', 'grid'))
      const lb = el('div', 'logo-box'); const logo = el('img'); logo.src = data.logoUrl; lb.append(logo); animate(lb, ['fade', .5, at(0.03)]); s.append(lb)
      s.append(typed(ctx, scene.headline || 'Order online', 'title', { left: 80, top: 640, w: 920, h: 230, max: 170, at: at(0.1) }))
      const site = el('div', 'mono', data.cta.site); Object.assign(site.style, { position: 'absolute', left: '80px', width: '920px', top: '930px', padding: '38px 0', textAlign: 'center', border: '4px dashed var(--line)', fontSize: '78px', fontWeight: '700', color: '#fff' })
      animate(site, ['type', .8, at(0.24), 'steps(18)']); s.append(site)
      if (data.cta.phone) s.append(typed(ctx, 'TEL ' + data.cta.phone, 'mono', { left: 80, top: 1170, w: 920, h: 90, max: 60, at: at(0.42), color: 'var(--accent)' }))
      const st = el('div', 'stampbox', scene.stamp || 'Order na!'); Object.assign(st.style, { left: '300px', top: '1380px', fontSize: '84px' })
      animate(st, [['stamp', .35, at(0.52), 'ease-out']]); s.append(st)
      const cur = el('div', 'mono', '▌'); Object.assign(cur.style, { position: 'absolute', left: '80px', top: '1600px', fontSize: '60px', color: 'var(--accent)' })
      animate(cur, ['blink', 1, at(0.6), 'linear', 'infinite']); s.append(cur)
      if (scene.character) s.append(ctx.cast(scene, { left: 820, top: 1520, w: 220, h: 330 }, { at: at(0.4), props: [] }))
      return s
    },

    problem(scene, ctx) {
      const { el, at, animate } = ctx
      const s = el('section'); s.append(el('div', 'grid'))
      const t = tag(ctx, `FIG. ${String(ctx.index + 1).padStart(2, '0')} · PROBLEM`, 80, 130, at(0.02)); t.style.background = '#FF6B6B'; s.append(t)
      s.append(typed(ctx, scene.headline, 'title', { left: 80, top: 210, w: 920, h: 380, max: 190, at: at(0.05) }))
      let top = 700
      if (scene.sub) { s.append(typed(ctx, scene.sub, 'mono', { left: 80, top: 620, w: 920, h: 100, max: 46, at: at(0.15), color: 'var(--dim)' })); top = 760 }
      s.append(ctx.cast(scene, { left: 100, top, w: 880, h: (scene.stamp ? 1560 : 1760) - top }, { at: at(0.2) }) || el('div'))
      if (scene.stamp) { const st = el('div', 'stampbox', scene.stamp); Object.assign(st.style, { left: '300px', top: '1620px', borderColor: '#FF6B6B', color: '#FF6B6B' }); animate(st, ['stamp', .35, at(0.6), 'ease-out']); ctx.fit(st, { w: 480, max: 80, min: 34 }); st.style.width = 'auto'; s.append(st) }
      return s
    },

    solution(scene, ctx) {
      const { el, at, animate, data } = ctx
      const s = el('section'); s.append(el('div', 'grid'))
      s.append(tag(ctx, `FIG. ${String(ctx.index + 1).padStart(2, '0')} · FIX`, 80, 130, at(0.02)))
      s.append(typed(ctx, scene.headline, 'title', { left: 80, top: 210, w: 920, h: 380, max: 190, at: at(0.05) }))
      let top = 700
      if (scene.sub) { s.append(typed(ctx, scene.sub, 'mono', { left: 80, top: 620, w: 920, h: 100, max: 46, at: at(0.15), color: 'var(--dim)' })); top = 760 }
      const props = scene.props && scene.props.length ? undefined : (data.product.prop ? [data.product.prop] : undefined)
      s.append(ctx.cast(scene, { left: 100, top, w: 880, h: (scene.stamp ? 1560 : 1760) - top }, { at: at(0.2), props }) || el('div'))
      if (scene.stamp) { const st = el('div', 'stampbox', scene.stamp); Object.assign(st.style, { left: '300px', top: '1620px' }); animate(st, ['stamp', .35, at(0.6), 'ease-out']); ctx.fit(st, { w: 480, max: 80, min: 34 }); st.style.width = 'auto'; s.append(st) }
      return s
    },
  },
}
</script>
<script src="_cast.js"></script>
<script src="_props.js"></script>
<script src="_runtime.js"></script>
</body>
</html>
