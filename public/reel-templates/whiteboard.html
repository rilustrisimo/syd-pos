<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hand-drawn Explainer</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@600;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  :root { --paper:#FBFAF6; --ink:#1E2A44; --blue:#2B59C3; --lightblue:#9DB7EA; --red:#D64545; }
  body { background:var(--paper); }
  .paper { position:absolute; inset:0; background:
      radial-gradient(ellipse at 20% 10%, rgba(0,0,0,.025), transparent 50%),
      radial-gradient(ellipse at 90% 90%, rgba(0,0,0,.03), transparent 50%), var(--paper); }
  .hand-font { font-family:'Kalam', cursive; font-weight:700; color:var(--ink); line-height:1.05; }
  .hand-font.light { font-weight:400; }
  .hand-font .w { display:inline-block; margin-right:.25em; }
  .header { position:absolute; left:70px; right:70px; top:70px; display:flex; justify-content:space-between; align-items:center;
    font-family:'Inter', sans-serif; font-weight:800; font-size:26px; letter-spacing:.12em; color:#8A93A6; }
  .header .crumb::after { content:''; display:block; width:120px; height:5px; background:var(--blue); margin-top:12px; border-radius:3px; }
  .steps { display:flex; gap:22px; }
  .step { display:flex; align-items:center; gap:8px; }
  .step i { width:38px; height:38px; border-radius:50%; border:3px solid #B9C0CF; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:20px; }
  .step.on { color:var(--ink); } .step.on i { border-color:var(--ink); }
  .sk { position:absolute; fill:none; stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
  .sk .d { stroke-dasharray:3000; }
  .photo { position:absolute; background:#fff; padding:22px; box-shadow:0 14px 30px rgba(0,0,0,.18); transform:rotate(-2deg); }
  .photo img { width:100%; height:100%; object-fit:contain; display:block; }
  .tape { position:absolute; width:200px; height:56px; background:rgba(157,183,234,.6); top:-24px; left:50%; margin-left:-100px; transform:rotate(-4deg); }
  .logo { position:absolute; left:290px; top:230px; width:500px; }
  .castbox { color:var(--ink); --fig-fill:#fff; --fig-accent:rgba(157,183,234,.55); --hat-fill:var(--lightblue); --fig-logo:var(--red); --fig-stroke:10; --prop-stroke:5; }
  .castbox .fig-mark { color:var(--red); }
  #hand { position:absolute; left:0; top:0; width:440px; height:440px; z-index:999; pointer-events:none; }

  @keyframes ink { from { clip-path: inset(-25% 100% -25% -5%); } to { clip-path: inset(-25% -5% -25% -5%); } }
  @keyframes draw { from { stroke-dashoffset:3000; } to { stroke-dashoffset:0; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes paperIn { from { opacity:0; transform:translateX(60px); } to { opacity:1; transform:none; } }
  @keyframes pinIn { 0% { opacity:0; transform:translateY(-80px) rotate(-8deg); } 100% { opacity:1; transform:rotate(-2deg); } }
</style>
</head>
<body>
<div id="stage"></div>
<style id="hand-keyframes"></style>
<script>
const NS = 'http://www.w3.org/2000/svg'
// Per-scene timeline of what the hand does: words written and paths drawn.
let events = []
let hatchId = 0

/** Handwritten text: each word is "written" in order; returns the node and when writing ends. */
function written(ctx, text, { left, top, w, h, max, min = 44, at, light, color, budget }) {
  const n = ctx.el('div', 'hand-font' + (light ? ' light' : ''))
  Object.assign(n.style, { position: 'absolute', left: left + 'px', top: top + 'px' })
  if (color) n.style.color = color
  const words = String(text).trim().split(/\s+/)
  let durs = words.map((wd) => Math.max(0.16, wd.length * 0.055))
  const total = durs.reduce((a, b) => a + b, 0) + 0.05 * words.length
  if (budget && total > budget) durs = durs.map((d) => (d * budget) / total)
  let t = at
  const spans = words.map((wd, i) => {
    const sp = ctx.el('span', 'w', wd); ctx.animate(sp, ['ink', durs[i], t, 'linear'])
    const ev = { node: sp, at: t, dur: durs[i] }
    t += durs[i] + 0.05; n.append(sp); return ev
  })
  events.push({ kind: 'words', spans })
  ctx.fit(n, { w, h, max, min })
  n.endsAt = t
  return n
}

/** Sketch: SVG paths drawn one after another within [at, at+dur]. */
function sketch(ctx, markup, { left, top, w, view, color = '#2B59C3', width = 9, at, dur = 1 }) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', view); s.setAttribute('class', 'sk')
  Object.assign(s.style, { left: left + 'px', top: top + 'px', width: w + 'px' })
  s.setAttribute('stroke', color); s.setAttribute('stroke-width', width); s.innerHTML = markup
  const paths = [...s.querySelectorAll('.d')]
  const each = dur / Math.max(1, paths.length)
  const evs = paths.map((p, i) => { ctx.animate(p, ['draw', each, at + i * each, 'ease-in-out']); return { node: p, at: at + i * each, dur: each } })
  events.push({ kind: 'draw', paths: evs })
  return s
}
function hatchDef(color) {
  const id = 'hatch' + (++hatchId)
  return { id, def: `<defs><pattern id="${id}" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="18" stroke="${color}" stroke-width="5"/></pattern></defs>` }
}
/** Hand holding a marker; the marker tip is at (20,20) of the 440×440 box. */
function handSvg() {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 440 440'); s.id = 'hand'
  s.innerHTML = `
    <g stroke="#1E2A44" stroke-width="5" stroke-linejoin="round">
      <path d="M20 20 L52 34 L34 52 Z" fill="#1E2A44"/>
      <path d="M44 30 L250 236 L232 254 L30 44 Z" fill="#2B59C3"/>
      <path d="M232 254 L250 236 L300 286 L282 304 Z" fill="#E8EDF7"/>
      <path d="M150 140 C 190 110, 250 120, 300 170 C 360 230, 420 300, 440 440 L 300 440 C 270 380, 220 330, 170 300 C 130 275, 110 240, 118 205 C 124 180, 135 160, 150 140 Z" fill="#F3CBA8"/>
      <path d="M150 140 C 175 150, 190 175, 185 205" fill="none"/>
      <path d="M118 205 C 150 205, 175 220, 190 245" fill="none"/>
      <path d="M132 168 C 110 150, 96 128, 104 112 C 112 98, 132 104, 152 126" fill="#F3CBA8"/>
    </g>`
  return s
}

function header(ctx) {
  const h = ctx.el('div', 'header')
  const crumb = ctx.el('div', 'crumb', `SYD · LESSON ${String(ctx.index + 1).padStart(2, '0')}`)
  const steps = ctx.el('div', 'steps')
  ctx.data.scenes.forEach((_, i) => {
    const st = ctx.el('div', 'step' + (i === ctx.index ? ' on' : '')); const n = ctx.el('i', null, String(i + 1)); st.append(n); steps.append(st)
  })
  h.append(crumb, steps); ctx.animate(h, ['fadeIn', .4, ctx.at(0)]); return h
}

/** The scene's character/props, drawn on by the marker hand. */
function castSketch(ctx, scene, box, opts) {
  const c = ctx.cast(scene, box, opts)
  if (c && c.draws.length) events.push({ kind: 'draw', paths: c.draws })
  return c || ctx.el('div')
}

/** Place `node` gap px below `target` once text is fitted (works for SVG too). */
let follows = []
const follow = (node, target, gap) => { follows.push([node, target, gap]); return node }

/** Problem / solution: headline, underline, sub, then the cast acting it out. */
function storyScene(scene, ctx, fix) {
  const { el, at, data } = ctx
  const s = el('section'); s.append(el('div', 'paper'), header(ctx))
  const hl = written(ctx, scene.headline, { left: 80, top: 200, w: 920, h: 360, max: 160, at: at(0.03), color: fix ? '#1E2A44' : '#D64545', budget: ctx.dur * 0.25 })
  const ul = follow(sketch(ctx, '<path class="d" d="M10 26 C 200 10, 400 40, 600 16"/>', { left: 80, top: 560, w: 620, view: '0 0 620 44', color: fix ? '#2B59C3' : '#D64545', at: hl.endsAt + 0.05, dur: 0.35 }), hl, 8)
  s.append(hl, ul)
  if (scene.sub) s.append(follow(written(ctx, scene.sub, { left: 90, top: 640, w: 900, h: 110, max: 56, light: true, color: '#5B6478', at: hl.endsAt + 0.3, budget: ctx.dur * 0.2 }), ul, 18))
  const props = fix && !(scene.props && scene.props.length) && data.product.prop ? [data.product.prop] : undefined
  s.append(castSketch(ctx, scene, { left: 90, top: 780, w: 900, h: scene.stamp ? 800 : 980 }, { at: Math.max(at(0.2), hl.endsAt + 0.4), props }))
  if (scene.stamp) {
    s.append(written(ctx, scene.stamp, { left: 300, top: 1620, w: 480, h: 150, max: 110, at: at(0.72), color: '#D64545', budget: 0.7 }))
  }
  return s
}

window.STYLE = {
  fonts: ['700 Kalam', '400 Kalam', '800 Inter'],
  transition: 'paperIn',
  cast: { enter: 'draw' },

  afterBuild(section, scene, ctx) {
    const html = document.documentElement
    html.classList.add('measuring')
    const base = section.getBoundingClientRect()
    for (const [node, target, gap] of follows) node.style.top = (target.getBoundingClientRect().bottom - base.top + gap) + 'px'
    follows = []

    // Hand path: waypoints (time, x, y) for the marker tip, relative to the section.
    const pts = []
    const rel = (r) => ({ l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top })
    const sorted = events.flatMap((e) => (e.kind === 'words' ? e.spans.map((s) => ({ ...s, kind: 'w' })) : e.paths.map((p) => ({ ...p, kind: 'p' }))))
      .sort((a, b) => a.at - b.at)
    for (const ev of sorted) {
      const box = rel(ev.node.getBoundingClientRect())
      if (ev.kind === 'w') {
        const y = box.t + (box.b - box.t) * 0.72
        pts.push([ev.at, box.l + 4, y], [ev.at + ev.dur, box.r - 2, y])
      } else {
        // Trace the drawn path's box: start, middle, end.
        pts.push([ev.at, box.l, box.t + (box.b - box.t) * 0.3], [ev.at + ev.dur * 0.5, (box.l + box.r) / 2, (box.t + box.b) / 2], [ev.at + ev.dur, box.r, box.b - (box.b - box.t) * 0.2])
      }
    }
    events = []
    html.classList.remove('measuring')
    if (!pts.length) return

    const REST = [1300, 2100]  // off-frame, lower right
    const t0 = scene.start, dur = Math.max(0.5, scene.end - scene.start)
    const frames = [[t0, ...REST], [Math.max(t0, pts[0][0] - 0.35), ...REST]]
    for (let i = 0; i < pts.length; i++) {
      const [t, x, y] = pts[i]
      const prev = frames[frames.length - 1]
      // Long pause between strokes: lift the hand out of frame.
      if (i > 0 && t - prev[0] > 1.1) frames.push([prev[0] + 0.3, ...REST], [t - 0.3, ...REST])
      frames.push([Math.max(t, frames[frames.length - 1][0] + 0.01), x, y])
    }
    const last = frames[frames.length - 1]
    frames.push([Math.min(t0 + dur, last[0] + 0.35), ...REST], [t0 + dur, ...REST])

    const name = 'handpath' + ctx.index
    const kf = frames.map(([t, x, y]) => `${Math.min(100, Math.max(0, ((t - t0) / dur) * 100)).toFixed(3)}% { transform: translate(${(x - 20).toFixed(1)}px, ${(y - 20).toFixed(1)}px) rotate(${(Math.sin(t * 9) * 3).toFixed(2)}deg); }`).join('\n')
    document.getElementById('hand-keyframes').textContent += `@keyframes ${name} {\n${kf}\n}\n`
    const hand = handSvg(); hand.style.transformOrigin = '20px 20px'
    ctx.animate(hand, [name, dur, t0, 'linear'])
    section.append(hand)
  },

  roles: {
    hook(scene, ctx) {
      const { el, at } = ctx
      const s = el('section'); s.append(el('div', 'paper'), header(ctx))
      const hl = written(ctx, scene.headline, { left: 80, top: 260, w: 920, h: 560, max: 170, at: at(0.06), budget: ctx.dur * 0.55 })
      const ul = follow(sketch(ctx, '<path class="d" d="M10 30 C 200 8, 420 40, 640 18 S 820 26, 860 20"/>', { left: 80, top: 800, w: 860, view: '0 0 870 50', at: hl.endsAt + 0.05, dur: 0.45 }), hl, 10)
      s.append(hl, ul)
      if (scene.sub) s.append(follow(written(ctx, scene.sub, { left: 90, top: 900, w: 900, h: 200, max: 64, light: true, at: at(0.5), budget: ctx.dur * 0.3 }), ul, 30))
      if (ctx.hasCast(scene)) { s.append(castSketch(ctx, scene, { left: 90, top: 1150, w: 900, h: 660 }, { at: Math.max(at(0.35), hl.endsAt + 0.55) })); return s }
      // Stick figure pointing at the headline, plus an arrow.
      const fig = sketch(ctx, '<circle class="d" cx="90" cy="70" r="55"/><path class="d" d="M90 125 L 90 300 M 90 300 L 40 420 M 90 300 L 140 420 M 90 180 L 20 250 M 90 180 L 190 90"/>',
        { left: 110, top: 1300, w: 220, view: '0 0 220 440', color: '#1E2A44', width: 12, at: at(0.45), dur: 0.9 })
      const arrow = sketch(ctx, '<path class="d" d="M20 300 C 90 200, 140 120, 230 40 M230 40 L 170 50 M230 40 L 220 100"/>', { left: 330, top: 1080, w: 260, view: '0 0 260 320', at: at(0.62), dur: 0.5 })
      s.append(fig, arrow)
      return s
    },

    product(scene, ctx) {
      const { el, at, animate, data } = ctx
      const s = el('section'); s.append(el('div', 'paper'), header(ctx))
      const hl = written(ctx, scene.headline, { left: 80, top: 200, w: 920, h: 220, max: 140, at: at(0.04), budget: ctx.dur * 0.3 })
      s.append(hl)
      if (data.product.imageUrl) {
        const ph = el('div', 'photo'); Object.assign(ph.style, { left: '230px', top: '500px', width: '620px', height: '620px' })
        const img = el('img'); img.src = data.product.imageUrl; ph.append(img, el('div', 'tape')); animate(ph, ['pinIn', .5, at(0.12)]); s.append(ph)
        s.append(sketch(ctx, '<rect class="d" x="10" y="10" width="700" height="700" rx="20"/>', { left: 190, top: 460, w: 720, view: '0 0 720 720', at: at(0.2), dur: 0.8, width: 7 }))
      } else if (ctx.productProp() !== 'cement_bag') {
        s.append(castSketch(ctx, scene, { left: 240, top: 470, w: 600, h: 600 }, { at: at(0.12), character: null, props: [ctx.productProp()] }))
        if (data.product.name) s.append(written(ctx, data.product.name, { left: 120, top: 1100, w: 840, h: 140, max: 90, min: 36, at: at(0.4), color: '#2B59C3', budget: 1.2 }))
      } else {
        const h = hatchDef('#9DB7EA')
        const bag = sketch(ctx, `${h.def}<path class="d" d="M70 70 Q250 30 430 70 L460 600 Q250 640 40 600 Z"/><path class="d" d="M70 70 Q250 110 430 70"/><rect class="d" x="105" y="210" width="290" height="200" rx="14" fill="#fff"/><path class="d" d="M120 470 H 380 M 120 520 H 330"/>`,
          { left: 290, top: 480, w: 500, view: '0 0 500 660', at: at(0.12), dur: 1.2, color: '#1E2A44' })
        // Hatched fill fades in once the outline is drawn.
        const fill = document.createElementNS(NS, 'path'); fill.setAttribute('d', 'M70 70 Q250 30 430 70 L460 600 Q250 640 40 600 Z'); fill.setAttribute('fill', `url(#${h.id})`); fill.setAttribute('stroke', 'none')
        bag.insertBefore(fill, bag.querySelector('.d')); animate(fill, ['fadeIn', .5, at(0.12) + 1.2])
        s.append(bag)
        s.append(written(ctx, data.product.name || scene.headline, { left: 400, top: 700, w: 280, h: 190, max: 70, min: 30, at: at(0.12) + 1.3, color: '#2B59C3', budget: 1.2 }))
      }
      if (scene.stamp) {
        const st = written(ctx, scene.stamp, { left: 300, top: 1290, w: 480, h: 150, max: 120, at: at(0.6), color: '#D64545', budget: ctx.dur * 0.25 })
        const ring = sketch(ctx, '<ellipse class="d" cx="300" cy="105" rx="285" ry="92" transform="rotate(-3 300 105)"/>', { left: 240, top: 1265, w: 600, view: '0 0 600 210', color: '#D64545', width: 8, at: at(0.6) + 0.6, dur: 0.6 })
        s.append(st, ring)
      }
      if (scene.character) s.append(castSketch(ctx, scene, { left: 60, top: 1300, w: 240, h: 380 }, { at: at(0.5), props: [], flip: false }))
      if (scene.sub) s.append(written(ctx, scene.sub, { left: scene.character ? 330 : 90, top: 1580, w: scene.character ? 660 : 900, h: 160, max: 60, light: true, at: at(0.4), budget: ctx.dur * 0.25 }))
      return s
    },

    proof(scene, ctx) {
      const { el, at } = ctx
      const s = el('section'); s.append(el('div', 'paper'), header(ctx))
      const items = (scene.items || []).slice(0, 3)
      const side = scene.character && items.length
      const hl = written(ctx, scene.headline, { left: 80, top: 200, w: side ? 620 : 920, h: 400, max: 170, at: at(0.03), budget: ctx.dur * 0.25 })
      const ul = follow(sketch(ctx, '<path class="d" d="M10 26 C 200 10, 400 40, 600 16"/>', { left: 80, top: 600, w: side ? 560 : 620, view: '0 0 620 44', at: hl.endsAt + 0.05, dur: 0.4 }), hl, 8)
      s.append(hl, ul)
      if (side) s.append(castSketch(ctx, scene, { left: 730, top: 170, w: 290, h: 430 }, { at: hl.endsAt + 0.2, props: [] }))
      else if (ctx.hasCast(scene)) s.append(castSketch(ctx, scene, { left: 90, top: 900, w: 900, h: 840 }, { at: at(0.35) }))
      if (scene.sub) s.append(follow(written(ctx, scene.sub, { left: 90, top: 680, w: 900, h: 110, max: 56, light: true, color: '#5B6478', at: at(0.15), budget: ctx.dur * 0.2 }), ul, 18))
      items.forEach((text, i) => {
        const t0 = at(0.38 + i * (0.5 / Math.max(1, items.length)))
        const top = 900 + i * 260
        const num = sketch(ctx, `<circle class="d" cx="60" cy="60" r="50"/>`, { left: 90, top, w: 120, view: '0 0 120 120', at: t0, dur: 0.35, width: 8 })
        const n = el('div', 'hand-font', String(i + 1)); Object.assign(n.style, { position: 'absolute', left: '90px', top: (top + 14) + 'px', width: '120px', textAlign: 'center', fontSize: '70px', color: '#2B59C3' })
        ctx.animate(n, ['fadeIn', .2, t0 + 0.3])
        s.append(num, n, written(ctx, text, { left: 250, top: top + 6, w: 740, h: 170, max: 100, at: t0 + 0.4, budget: 1.4 }))
      })
      if (scene.stamp) s.append(written(ctx, scene.stamp, { left: 560, top: 780, w: 440, h: 110, max: 80, at: at(0.3), color: '#D64545', budget: 0.8 }))
      return s
    },

    cta(scene, ctx) {
      const { el, at, animate, data } = ctx
      const s = el('section'); s.append(el('div', 'paper'), header(ctx))
      const logo = el('img', 'logo'); logo.src = data.logoUrl; logo.style.filter = 'brightness(0) saturate(100%) invert(14%) sepia(23%) saturate(1500%) hue-rotate(190deg)'
      animate(logo, ['fadeIn', .5, at(0.03)]); s.append(logo)
      s.append(sketch(ctx, '<rect class="d" x="10" y="10" width="580" height="250" rx="26"/>', { left: 240, top: 180, w: 600, view: '0 0 600 270', at: at(0.03), dur: 0.7, color: '#1E2A44', width: 7 }))
      const hl = written(ctx, scene.headline || 'Order online', { left: 80, top: 560, w: 920, h: 240, max: 150, at: at(0.14), budget: ctx.dur * 0.2 })
      const site = written(ctx, data.cta.site, { left: 90, top: 860, w: 900, h: 140, max: 110, at: at(0.3), color: '#2B59C3', budget: 0.9 })
      const ul = follow(sketch(ctx, '<path class="d" d="M10 26 C 250 8, 520 40, 840 14"/>', { left: 90, top: 1000, w: 850, view: '0 0 850 44', at: at(0.3) + 1, dur: 0.4 }), site, 6)
      s.append(hl, site, ul)
      if (data.cta.phone) s.append(written(ctx, '☎ ' + data.cta.phone, { left: 90, top: 1110, w: 900, h: 110, max: 72, light: true, at: at(0.45), budget: 1 }))
      const st = written(ctx, scene.stamp || 'Order na!', { left: 300, top: 1390, w: 480, h: 150, max: 120, at: at(0.6), color: '#D64545', budget: 0.8 })
      const box = sketch(ctx, '<rect class="d" x="10" y="10" width="600" height="190" rx="18" transform="rotate(-2 310 105)"/><path class="d" d="M -160 60 C -110 40, -70 60, -20 95 M -20 95 L -70 98 M -20 95 L -45 52"/>',
        { left: 230, top: 1360, w: 620, view: '0 0 620 210', color: '#D64545', width: 8, at: at(0.6) + 0.7, dur: 0.8 })
      s.append(st, box)
      if (scene.character) s.append(castSketch(ctx, scene, { left: 40, top: 1600, w: 200, h: 280 }, { at: at(0.75), props: [], flip: false }))
      return s
    },

    problem(scene, ctx) { return storyScene(scene, ctx, false) },
    solution(scene, ctx) { return storyScene(scene, ctx, true) },
  },
}
</script>
<script src="_cast.js"></script>
<script src="_props.js"></script>
<script src="_runtime.js"></script>
</body>
</html>
