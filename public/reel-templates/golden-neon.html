<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Golden Neon</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  :root { --gold:#FFC94D; --gold2:#FFE3A1; --bg:#07070B; --rose:#FF6B8B; }
  body { background:var(--bg); }
  .bg { position:absolute; inset:0; background:
      radial-gradient(ellipse at 50% 35%, rgba(255,201,77,.10), transparent 60%),
      radial-gradient(ellipse at 50% 110%, rgba(255,107,139,.10), transparent 55%), var(--bg); }
  .bg::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 6px); }
  .neon { font-family:'Bebas Neue', sans-serif; line-height:.92; color:var(--gold2); letter-spacing:.02em;
    text-shadow:0 0 6px #fff3, 0 0 14px var(--gold), 0 0 34px var(--gold), 0 0 70px rgba(255,201,77,.6); }
  .neon.rose { color:#FFD0DA; text-shadow:0 0 6px #fff3, 0 0 14px var(--rose), 0 0 34px var(--rose), 0 0 70px rgba(255,107,139,.6); }
  .inter { font-family:'Inter', sans-serif; font-weight:600; color:#EDE6D6; }
  .tube { position:absolute; fill:none; stroke:var(--gold); stroke-linecap:round; filter:drop-shadow(0 0 8px var(--gold)) drop-shadow(0 0 22px rgba(255,201,77,.7)); }
  .tube.rose { stroke:var(--rose); filter:drop-shadow(0 0 8px var(--rose)) drop-shadow(0 0 22px rgba(255,107,139,.7)); }
  .tube rect, .tube path, .tube circle { stroke-dasharray:6000; }
  .spark { position:absolute; width:40px; height:40px; background:radial-gradient(circle, #fff 0 10%, var(--gold) 20%, transparent 60%);
    clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%); }
  .sweep { position:absolute; inset:0; background:linear-gradient(105deg, transparent 40%, rgba(255,227,161,.16) 50%, transparent 60%); }
  .pill { position:absolute; left:90px; width:900px; height:200px; border:6px solid var(--gold); border-radius:999px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 16px var(--gold), inset 0 0 16px rgba(255,201,77,.5); }
  .photo { position:absolute; left:240px; top:520px; width:600px; height:600px; border-radius:50%; overflow:hidden; background:#fff;
    box-shadow:0 0 0 10px var(--gold), 0 0 50px var(--gold); }
  .photo img { width:100%; height:100%; object-fit:contain; }
  .logo { position:absolute; left:290px; top:260px; width:500px; filter:drop-shadow(0 0 12px var(--gold)) drop-shadow(0 0 30px rgba(255,201,77,.6)); }

  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes flickerOn { 0% { opacity:0; } 8% { opacity:1; } 12% { opacity:.15; } 20% { opacity:1; } 26% { opacity:.3; } 34%,100% { opacity:1; } }
  @keyframes buzz { 0%,100% { opacity:1; } 47% { opacity:1; } 48% { opacity:.55; } 50% { opacity:1; } 92% { opacity:1; } 93% { opacity:.7; } }
  @keyframes draw { from { stroke-dashoffset:6000; } to { stroke-dashoffset:0; } }
  @keyframes sweep { from { transform:translateX(-120%); } to { transform:translateX(120%); } }
  @keyframes twinkle { 0%,100% { opacity:0; transform:scale(.2) rotate(0); } 50% { opacity:1; transform:scale(1) rotate(45deg); } }
  @keyframes rise { from { opacity:0; transform:translateY(60px); } to { opacity:1; transform:none; } }
  @keyframes glowPulse { 0%,100% { filter:brightness(1); transform:scale(1); } 50% { filter:brightness(1.35); transform:scale(1.04); } }
  @keyframes zoomIn { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const NS = 'http://www.w3.org/2000/svg'
function tube(markup, { left, top, w, view, rose }) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', view); s.setAttribute('class', 'tube' + (rose ? ' rose' : ''))
  Object.assign(s.style, { left: left + 'px', top: top + 'px', width: w + 'px' }); s.innerHTML = markup; s.setAttribute('stroke-width', '9'); return s
}
/** Neon text that flickers on, then buzzes now and then. */
function neon(ctx, text, { left, top, w, h, max, min = 60, at, rose, center }) {
  const n = ctx.el('div', 'neon' + (rose ? ' rose' : ''), text)
  Object.assign(n.style, { position: 'absolute', left: left + 'px', top: top + 'px', textAlign: center ? 'center' : 'left' })
  ctx.animate(n, [['flickerOn', .7, at, 'linear'], ['buzz', 3.1, at + .8, 'linear', 'infinite']])
  ctx.fit(n, { w, h, max, min }); return n
}
function sparkles(ctx, n, seed) {
  const out = []
  for (let i = 0; i < n; i++) {
    const r = (k) => ((Math.sin((seed + i) * 99.13 + k) + 1) / 2)
    const sp = ctx.el('div', 'spark'); Object.assign(sp.style, { left: (60 + r(1) * 940) + 'px', top: (80 + r(2) * 1740) + 'px', transform: `scale(${.5 + r(3)})` })
    ctx.animate(sp, ['twinkle', 1.6 + r(4) * 1.4, ctx.at(0) + r(5) * 1.5, 'ease-in-out', 'infinite']); out.push(sp)
  }
  return out
}
function sweep(ctx) { const s = ctx.el('div', 'sweep'); ctx.animate(s, ['sweep', 1.6, ctx.at(0.2), 'ease-in-out']); return s }

window.STYLE = {
  fonts: ['Bebas Neue', '600 Inter', '800 Inter'],
  transition: 'fadeIn',
  roles: {
    hook(scene, ctx) {
      const { el, at, animate } = ctx
      const s = el('section'); s.append(el('div', 'bg'), ...sparkles(ctx, 10, 1))
      const frame = tube('<rect x="10" y="10" width="940" height="900" rx="60"/>', { left: 60, top: 330, w: 960, view: '0 0 960 920' })
      animate(frame.querySelector('rect'), ['draw', 1.3, at(0.02), 'ease-in-out']); s.append(frame)
      const hl = neon(ctx, scene.headline, { left: 120, top: 420, w: 840, h: 720, max: 260, at: at(0.2), center: true })
      Object.assign(hl.style, { height: '720px', display: 'flex', alignItems: 'center', justifyContent: 'center' })
      s.append(hl)
      if (scene.sub) { const sub = el('div', 'inter', scene.sub); Object.assign(sub.style, { position: 'absolute', left: '100px', top: '1330px', textAlign: 'center' }); animate(sub, ['rise', .5, at(0.5)]); ctx.fit(sub, { w: 880, h: 200, max: 64, min: 36 }); s.append(sub) }
      s.append(sweep(ctx))
      return s
    },

    product(scene, ctx) {
      const { el, at, animate, data } = ctx
      const s = el('section'); s.append(el('div', 'bg'), ...sparkles(ctx, 8, 2))
      s.append(neon(ctx, scene.headline, { left: 90, top: 170, w: 900, h: 260, max: 200, at: at(0.03), center: true }))
      const ring = tube('<circle cx="370" cy="370" r="355"/>', { left: 170, top: 450, w: 740, view: '0 0 740 740' })
      animate(ring.querySelector('circle'), ['draw', 1.1, at(0.08), 'ease-in-out']); s.append(ring)
      if (data.product.imageUrl) { const ph = el('div', 'photo'); const img = el('img'); img.src = data.product.imageUrl; ph.append(img); animate(ph, ['zoomIn', .6, at(0.2)]); s.append(ph) }
      else {
        const bag = tube('<path d="M70 70 Q250 30 430 70 L460 600 Q250 640 40 600 Z"/><path d="M70 70 Q250 110 430 70"/><path d="M130 510 H370"/>', { left: 350, top: 540, w: 380, view: '0 0 500 660' })
        bag.querySelectorAll('path').forEach((p, i) => animate(p, ['draw', 1.0, at(0.18) + i * .15, 'ease-out'])); s.append(bag)
        const name = el('div', 'neon', data.product.name || scene.headline)
        Object.assign(name.style, { position: 'absolute', left: '380px', top: '700px', height: '220px', display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center' })
        animate(name, ['flickerOn', .7, at(0.45), 'linear']); s.append(name); ctx.fit(name, { w: 320, h: 220, max: 110, min: 40 })
      }
      if (scene.stamp) {
        const box = tube('<rect x="8" y="8" width="704" height="214" rx="30"/>', { left: 180, top: 1270, w: 720, view: '0 0 720 230', rose: true })
        animate(box.querySelector('rect'), ['draw', .7, at(0.58), 'ease-out'])
        s.append(box, neon(ctx, scene.stamp, { left: 210, top: 1300, w: 660, h: 170, max: 160, at: at(0.62), rose: true, center: true }))
      }
      if (scene.sub) { const sub = el('div', 'inter', scene.sub); Object.assign(sub.style, { position: 'absolute', left: '100px', top: '1580px', textAlign: 'center' }); animate(sub, ['rise', .5, at(0.4)]); ctx.fit(sub, { w: 880, h: 160, max: 60, min: 34 }); s.append(sub) }
      s.append(sweep(ctx))
      return s
    },

    proof(scene, ctx) {
      const { el, at, animate } = ctx
      const s = el('section'); s.append(el('div', 'bg'), ...sparkles(ctx, 8, 3))
      s.append(neon(ctx, scene.headline, { left: 90, top: 160, w: 900, h: 460, max: 260, at: at(0.03), center: true }))
      if (scene.sub) { const sub = el('div', 'inter', scene.sub); Object.assign(sub.style, { position: 'absolute', left: '100px', top: '660px', textAlign: 'center', letterSpacing: '.08em', textTransform: 'uppercase' }); animate(sub, ['rise', .5, at(0.12)]); ctx.fit(sub, { w: 880, h: 120, max: 54, min: 30 }); s.append(sub) }
      if (scene.stamp) s.append(neon(ctx, scene.stamp, { left: 90, top: 760, w: 900, h: 130, max: 110, at: at(0.28), rose: true, center: true }))
      const items = (scene.items || []).slice(0, 3)
      items.forEach((text, i) => {
        const p = el('div', 'pill'); p.style.top = (930 + i * 250) + 'px'
        const t = el('div', 'neon', text); t.style.textAlign = 'center'; p.append(t)
        animate(p, [['flickerOn', .7, at(0.36 + i * (0.5 / Math.max(1, items.length))), 'linear'], ['buzz', 3.4, at(0.4) + 1 + i * .4, 'linear', 'infinite']])
        ctx.fit(t, { w: 820, h: 170, max: 130, min: 50 }); s.append(p)
      })
      s.append(sweep(ctx))
      return s
    },

    cta(scene, ctx) {
      const { el, at, animate, data } = ctx
      const s = el('section'); s.append(el('div', 'bg'), ...sparkles(ctx, 12, 4))
      const logo = el('img', 'logo'); logo.src = data.logoUrl; animate(logo, ['flickerOn', .8, at(0.03), 'linear']); s.append(logo)
      s.append(neon(ctx, scene.headline || 'Order online', { left: 90, top: 640, w: 900, h: 240, max: 210, at: at(0.12), center: true }))
      const site = el('div', 'pill inter', data.cta.site); Object.assign(site.style, { top: '940px', fontSize: '86px', fontWeight: '800', color: '#FFF1CC' })
      animate(site, ['flickerOn', .7, at(0.25), 'linear']); s.append(site)
      if (data.cta.phone) { const ph = el('div', 'inter', '☎ ' + data.cta.phone); Object.assign(ph.style, { position: 'absolute', left: '90px', width: '900px', top: '1210px', textAlign: 'center', fontSize: '62px', fontWeight: '800' }); animate(ph, ['rise', .5, at(0.42)]); s.append(ph) }
      const btn = neon(ctx, scene.stamp || 'Order na!', { left: 190, top: 1400, w: 700, h: 200, max: 170, at: at(0.52), rose: true, center: true })
      btn.style.animation += `, glowPulse 1.1s ease-in-out ${(at(0.52) + .9).toFixed(3)}s infinite both`
      const box = tube('<rect x="8" y="8" width="764" height="244" rx="40"/>', { left: 150, top: 1370, w: 780, view: '0 0 780 260', rose: true })
      animate(box.querySelector('rect'), ['draw', .7, at(0.5), 'ease-out'])
      s.append(box, btn, sweep(ctx))
      return s
    },
  },
}
</script>
<script src="_runtime.js"></script>
</body>
</html>
